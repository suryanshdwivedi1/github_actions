name: Using Actions

on: push

jobs:
    build: 
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: react-app
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Setup node
              uses: actions/setup-node@v7
              with:
                node-version: '24.x'
            - name: Install Dependencies
              run: npm ci
            - name: Run Unit Test
              run: npm run test

